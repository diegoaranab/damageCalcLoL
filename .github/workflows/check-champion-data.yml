name: Check champion ability data

on:
  schedule:
    - cron: "7 6 * * *"
      timezone: "America/Mexico_City"
  push:
    branches: [main]
    paths:
      - "scripts/build-cc-data.mjs"
      - "scripts/check-patch.mjs"
      - "scripts/enable-cc-ui.mjs"
      - "scripts/validate-cc-data.mjs"
      - "scripts/lib/cc-parser.mjs"
      - "scripts/test-cc-parser.mjs"
      - "site/data/champion-cc.json"
      - ".github/workflows/check-champion-data.yml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-cc-data.mjs"
      - "scripts/check-patch.mjs"
      - "scripts/validate-cc-data.mjs"
      - "scripts/lib/cc-parser.mjs"
      - "scripts/test-cc-parser.mjs"
      - ".github/workflows/check-champion-data.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild crowd-control data even if the Riot patch has not changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: champion-ability-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      latest_patch: ${{ steps.patch.outputs.latest_patch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test crowd-control parser
        run: npm run test:cc

      - name: Check Riot patch
        id: patch
        env:
          FORCE_CC_REFRESH: ${{ github.event_name == 'pull_request' && '1' || (github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0') }}
        run: npm run cc:check

      - name: Check out Meraki lolstaticdata
        if: steps.patch.outputs.changed == 'true'
        uses: actions/checkout@v6
        with:
          repository: meraki-analytics/lolstaticdata
          ref: master
          path: _vendor/lolstaticdata
          persist-credentials: false

      - name: Set up Python
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _vendor/lolstaticdata/requirements.txt

      - name: Install League Wiki parser dependencies
        if: steps.patch.outputs.changed == 'true'
        run: python -m pip install -r _vendor/lolstaticdata/requirements.txt

      - name: Apply Meraki parser compatibility patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("_vendor/lolstaticdata/lolstaticdata/champions/pull_champions_wiki.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)modifier = Modifier\(\n"
              r"[ \t]*values=\[0 for _ in range\(nvalues\)\],\n"
              r"[ \t]*units=\[lvling for _ in range\(nvalues\)\],\n"
              r"[ \t]*\)\n"
              r"[ \t]*modifiers\.append\(modifier\)"
          )

          def replacement(match):
              indent = match.group("indent")
              return (
                  f"{indent}# Damage Draft only needs successfully parsed semantic values.\n"
                  f"{indent}# Current Wiki rows can omit nvalues; skip only this failed\n"
                  f"{indent}# modifier instead of aborting the entire champion roster.\n"
                  f"{indent}continue"
              )

          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Meraki fallback block, patched {count}; review upstream changes.")
          path.write_text(patched, encoding="utf-8")
          print("Applied narrow Meraki leveling fallback compatibility patch.")
          PY

      - name: Generate current League Wiki ability data
        if: steps.patch.outputs.changed == 'true'
        working-directory: _vendor/lolstaticdata
        run: python -m lolstaticdata.champions --abilities

      - name: Enable crowd-control UI
        if: steps.patch.outputs.changed == 'true'
        run: npm run ui:enable

      - name: Build crowd-control data
        if: steps.patch.outputs.changed == 'true'
        env:
          MERAKI_CHAMPIONS_PATH: _vendor/lolstaticdata/champions.json
        run: npm run cc:build

      - name: Validate generated crowd-control data
        if: steps.patch.outputs.changed == 'true'
        run: npm run cc:validate

      - name: Commit crowd-control data and UI bootstrap
        if: steps.patch.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/data/champion-cc.json
          if git diff --cached --quiet; then
            echo "No crowd-control data or UI bootstrap changes to commit."
          else
            git commit -m "chore(data): refresh champion crowd control"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.patch.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.patch.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
