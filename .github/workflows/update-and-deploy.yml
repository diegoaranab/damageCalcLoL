name: Update champion damage and deploy Pages

on:
  schedule:
    - cron: "17 5 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      champions:
        description: "Optional comma-separated champion IDs for a test run (blank = all)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: damage-data-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test parsers
        run: npm test

      - name: Refresh champion damage data
        env:
          CHAMPIONS: ${{ github.event.inputs.champions || '' }}
          LOLALYTICS_TIER: d2_plus
          LOLALYTICS_PATCH: "7"
          REQUEST_DELAY_MS: "1500"
        run: npm run scrape

      - name: Commit refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/champion-damage.json
          if git diff --cached --quiet; then
            echo "No damage data changes to commit."
          else
            git commit -m "chore(data): refresh champion damage"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
